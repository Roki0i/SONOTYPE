version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/apps/studio"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      remotion-suite:
        applies-to: version-updates
        patterns:
          - "remotion"
          - "@remotion/*"
