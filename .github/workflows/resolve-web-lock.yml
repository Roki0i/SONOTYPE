name: Resolve web renderer lock (temporary)
on:
  push:
    branches: ['feature/pages-browser-export']
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'Resolve web renderer lockfile')"
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve pinned dependency lock without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install and audit
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Commit resolved lock to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve web renderer lockfile"
            git push origin HEAD:feature/pages-browser-export
          fi
        working-directory: .
