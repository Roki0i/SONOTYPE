name: Web / GitHub Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oto-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Pages build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build Vite for GitHub Pages
        env:
          VITE_PAGES_BUILD: 'true'
        run: npm run build:pages
      - name: Verify GitHub Pages entry and asset prefix
        run: |
          test -s dist/index.html
          test -s dist/demo.wav
          test -s dist/demo-analysis.json
          grep -q '/SONOTYPE/assets/' dist/index.html
      - name: Render original 8-second portfolio demo
        run: |
          npx remotion render src/remotion/entry.ts OTO-Demo dist/sonotype-demo.mp4 --frames=0-239 --scale=0.5 --codec=h264 --concurrency=2
          test -s dist/sonotype-demo.mp4
      - name: Upload GitHub Pages bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/studio/dist

  deploy:
    name: Publish website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    name: Public desktop/mobile browser smoke
    needs: [build, deploy]
    # PRs validate the candidate bundle in CI; public-site smoke only follows a successful deploy.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install --disable-pip-version-check -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/live_site_smoke.py
      - name: Upload real public-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotype-public-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
