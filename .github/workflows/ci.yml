name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Generate demo
        run: python generate_demo.py
      - name: JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Unit tests
        run: npm test
      - name: Python security tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m py_compile server.py generate_demo.py tests/e2e_browser.py

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Chromium and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          python -m pip install --disable-pip-version-check -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Browser playback and MP4 export
        run: python -u tests/e2e_browser.py
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore

  windows-browser-e2e:
    name: Windows / ${{ matrix.channel }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [chrome, msedge]
    env:
      OTO_BROWSER_CHANNEL: ${{ matrix.channel }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned browser automation
        run: python -m pip install --disable-pip-version-check -r requirements-e2e.txt
      - name: Install FFmpeg 9.0.2 from winget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id Gyan.FFmpeg --exact --version 9.0.2 --source winget --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "winget FFmpeg installation failed: $LASTEXITCODE" }
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages'),
            'C:\Program Files\WinGet\Packages'
          )
          $ffmpeg = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $ffmpeg = Get-ChildItem $root -Filter ffmpeg.exe -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { Test-Path (Join-Path $_.DirectoryName 'ffprobe.exe') } | Select-Object -First 1
              if ($ffmpeg) { break }
            }
          }
          if (-not $ffmpeg) { throw 'Could not locate installed ffmpeg.exe and ffprobe.exe' }
          $binDir = $ffmpeg.DirectoryName
          Add-Content -Path $env:GITHUB_PATH -Value $binDir -Encoding utf8
          & (Join-Path $binDir 'ffmpeg.exe') -version | Select-Object -First 1
      - name: Windows browser playback and MP4 export
        run: python -u tests/e2e_browser.py
      - name: Upload Windows browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.channel }}-failure
          path: test-results/
          if-no-files-found: ignore

  modern-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies via npm ci
        run: npm ci --ignore-scripts --no-fund
      - name: Security audit of full dependency tree
        run: npm audit --audit-level=high
      - name: Test local export API validation
        run: node --test scripts/export-api.test.mjs
      - name: Typecheck and Vite build
        run: npm run build
      - name: Validate Remotion composition
        run: npx remotion compositions src/remotion/entry.ts
      - name: Render first 60 frames to H.264 MP4
        run: npx remotion render src/remotion/entry.ts OTO-Demo out/ci-demo.mp4 --frames=0-59 --codec=h264 --concurrency=2
      - name: Install FFmpeg for output inspection
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: API export with uploaded WAV (H.264/AAC smoke test)
        run: node scripts/export-api-smoke.mjs
      - name: Validate rendered MP4
        run: |
          test -s out/ci-demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 out/ci-demo.mp4
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 out/ci-demo.mp4)" = "aac"
