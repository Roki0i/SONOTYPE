name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate demo
        run: python generate_demo.py
      - name: JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Unit tests
        run: npm test
      - name: Python syntax
        run: python -m py_compile server.py generate_demo.py
