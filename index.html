<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c131d"><title>SONOTYPE</title><link rel="stylesheet" href="./src/styles.css"></head>
<body><div class="layout"><aside class="sidebar">
<div class="brand">SONOTYPE<small>SIGNAL VISUALIZATION</small></div>
<section><label class="eyebrow">01 / SOURCE</label><label class="drop" id="drop" for="audioFile"><strong>♫ 音楽ファイルを読み込む</strong><small>MP3 / WAV / M4A · ドラッグ&ドロップ</small></label><input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav" hidden><div class="file" id="audioName">デモ音源を準備中</div>
<label class="drop mini" for="midiFile"><strong>▥ MIDIを読み込む</strong><small>ピアノロール表示用（任意）</small></label><input id="midiFile" type="file" accept=".mid,.midi" hidden><div class="file" id="midiName">MIDI未選択</div></section>
<section><label class="eyebrow">02 / STYLE</label><label>カラーテーマ</label><div class="choice"><button data-theme="arctic" class="chosen">ARCTIC</button><button data-theme="mint">MINT</button><button data-theme="violet">VIOLET</button></div><label>動画の長さ</label><div class="choice"><button data-duration="8">8秒</button><button data-duration="15" class="chosen">15秒</button><button data-duration="30">30秒</button></div><p class="meta">1080 × 1920 / 30 FPS / MP4</p></section>
<section><label class="eyebrow">03 / EXPORT</label><button id="exportButton" class="export">MP4を書き出す</button><progress id="progress" max="100" value="0" hidden></progress><small>実時間録画とローカルFFmpeg変換を使用します。</small></section>
<footer id="status" role="status">読み込み中…</footer></aside>
<main><header><span>WORKSPACE / NEW VISUALIZATION</span><span>PROTO v0.1</span></header>
<div class="workspace"><div class="heading"><h1>音楽を、視覚に。</h1><p>WAVEFORM · SPECTRUM · MIDI</p></div><div class="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
<div class="transport"><button id="playButton" aria-label="再生・一時停止">▶</button><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="15" value="0" step="0.01"><span id="length">00:15</span></div>
<div class="foot">SONOTYPE <span>LOCAL FIRST · ORIGINAL DEMO</span></div></div></main></div>
<script type="module" src="./src/app.js"></script></body></html>
